# docker-compose.yml — Coolify-friendly single-service deployment
#
# IMPORTANT — before deploying:
#   1. Mount your USB stick on the HOST (see README /etc/fstab section).
#      Any mount under `/mnt` will be visible to Watchy automatically.
#   2. Fill in the .env file (see .env.example).
#   3. Log into the UI → Settings → pick the disk from the list.
#
services:
  watchy:
    build: .
    image: watchy:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      MOUNTS_ROOT: /app/mounts
      # BACKUP_DIR is kept only as a dev/fallback; production uses the disk
      # selected in the UI (stored in db.json).
      BACKUP_DIR: /app/backups
    ports:
      - "3000:3000"
    volumes:
      # ---- App configuration & backup index (small, stays on the SD card) --
      - watchy-data:/app/data

      # ---- Storage candidates -----------------------------------------------
      # Bind-mount the host's /mnt so Watchy sees every disk mounted there.
      # `:rslave` so mount events on the host propagate into the container —
      # this lets you unplug/replug across a restart without recreating.
      - type: bind
        source: /mnt
        target: /app/mounts
        bind:
          propagation: rslave

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  watchy-data:
