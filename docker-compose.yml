# docker-compose.yml — Coolify-friendly single-service deployment
#
# IMPORTANT — before deploying:
#   1. Adapt the BACKUP host path below to your USB mount point (e.g. /mnt/usb-backup).
#   2. Fill in the .env file (see .env.example).
#
services:
  watchy:
    build: .
    image: watchy:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Force these two INSIDE-container paths — they must match the volume mappings.
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
    ports:
      - "3000:3000"
    volumes:
      # ---- App configuration & backup index (small, stays on the SD card) --
      - watchy-data:/app/data

      # ---- Backup destination (bind mount to the USB stick on the host) ----
      # CHANGE the left-hand path to wherever your USB stick is mounted on the
      # Raspberry Pi. See README for how to mount it durably via /etc/fstab.
      - /mnt/usb-backup:/app/backups

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  watchy-data:
